name: Release packages
run-name: "Release ${{ inputs.tag }} (dry-run: ${{ inputs.dry-run }})"
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "pattern: [0-9]+.[0-9]+.[0-9]+.[0-9]+"
        required: true
      dry-run:
        description: "dry-run: build and pack only, skip publish and release creation"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write  # enable GitHub OIDC token issuance for this job

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10
      # https://learn.microsoft.com/en-us/nuget/nuget-org/trusted-publishing
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - run: |
          dotnet build -c Release -p:Version=${{ inputs.tag }}
          dotnet pack -o ./artifacts --no-build -p:Version=${{ inputs.tag }}
      - if: ${{ !inputs.dry-run }}
        run: dotnet nuget push ./artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{steps.login.outputs.NUGET_API_KEY}} --skip-duplicate
      - if: ${{ !inputs.dry-run }}
        run: gh release create ${{inputs.tag}} --generate-notes ./artifacts/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
